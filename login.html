
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول | تعلّم</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    body,
    .login-page,
    .login-page input,
    .login-page button {
      font-family: 'Cairo', Tahoma, Arial, sans-serif;
    }

    .login-page {
      max-width: 480px;
      margin: 60px auto;
      padding: 28px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 30px #0000000d;
    }

    .login-page form {
      display: grid;
      gap: 12px;
    }

    .login-page input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d5e2da;
      border-radius: 9px;
      font: inherit;
    }

    .login-page button {
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="container login-page">
    <div class="brand">
      <div class="logo">ت</div>
      <span>تعلّم</span>
    </div>

    <h1>مرحبًا بعودتك</h1>
    <p>سجّل الدخول لمتابعة دروسك التعليمية.</p>

    <form id="login-form">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="email"
             required placeholder="name@example.com">

      <label for="password">كلمة المرور</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <button class="btn btn-primary" id="login-button" type="submit">
        تسجيل الدخول
      </button>

      <p id="login-message" role="status" aria-live="polite"></p>
    </form>

    <p>ليس لديك حساب؟ <a href="signup.html">أنشئ حسابًا جديدًا</a></p>
    <p><a href="index.html">العودة إلى الصفحة الرئيسية</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
