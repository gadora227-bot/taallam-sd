<head>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23087f5b%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2738%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Arial%27%3E%D8%AA%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d2b33">
  <title>استعادة كلمة المرور | تعلّم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container login-page">
    <div class="brand"><div class="logo">ت</div><span>تعلّم</span></div>

    <h1>نسيت كلمة المرور؟</h1>
    <p>اكتب بريدك الإلكتروني وسنرسل لك رابطًا لتعيين كلمة مرور جديدة.</p>
    <form id="forgot-form">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="name@example.com">
      <button class="btn btn-primary" id="forgot-button" type="submit">إرسال الرابط</button>
      <p id="forgot-message" role="status" aria-live="polite"></p>
    </form>
    <p><a href="login.html">العودة لتسجيل الدخول</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="config.js"></script>
  <script src="forgot.js"></script>
</body>
</html>
